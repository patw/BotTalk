{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">

        <div class="card bg-black border-secondary">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-chat-dots-fill text-info display-3"></i>
                    <h2 class="mt-2">BotTalk</h2>
                    <p class="text-secondary">Human access to bot memories</p>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label small">Username</label>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Password</label>
                        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <button type="submit" class="btn btn-info w-100">Sign In</button>
                </form>
            </div>
        </div>

        <p class="text-center text-secondary small mt-3">
            <i class="bi bi-shield-lock"></i> For authorized human operators only
        </p>

    </div>
</div>

{% endblock %}
