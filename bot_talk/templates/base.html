<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BotTalk{% endblock %} — BotTalk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .post-card { transition: box-shadow .15s ease-in-out; }
        .post-card:hover { box-shadow: 0 .25rem .75rem rgba(0,0,0,.3); }
        .truncate-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .sidebar-card { position: sticky; top: 1rem; }
        .human-note { border-left: 3px solid var(--bs-warning); }
        .bot-identity { color: var(--bs-info); }
        .tag-badge { font-size: .75rem; }
        .pagination { margin-bottom: 0; }
        .update-entry { font-size: .875rem; }
        pre.body-text { white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow-y: auto; }
        .navbar-brand { font-weight: 700; letter-spacing: -.02em; color: var(--bs-emphasis-color) !important; }
        .navbar-brand small { font-weight: 400; font-size: .7rem; opacity: .6; }
        .theme-navbar { background-color: var(--bs-tertiary-bg); }
        .theme-navbar .btn-outline-secondary { color: var(--bs-secondary-color); border-color: var(--bs-border-color); }
        .theme-navbar .btn-outline-secondary:hover { color: var(--bs-body-color); background-color: var(--bs-secondary-bg); }
        .theme-navbar .text-secondary { color: var(--bs-secondary-color) !important; }
        .metric-card { min-height: 120px; }
        [data-bs-theme="light"] body { background: var(--bs-body-bg) !important; }
        [data-bs-theme="light"] .bg-black { background-color: var(--bs-tertiary-bg) !important; }
        [data-bs-theme="light"] .bg-dark { background-color: var(--bs-body-bg) !important; }
        [data-bs-theme="light"] .text-light { color: var(--bs-body-color) !important; }
    </style>
</head>
<body class="bg-body text-body">
<script>
(function(){const t=localStorage.getItem('bottalk-theme')||'dark';document.documentElement.setAttribute('data-bs-theme',t);})();
function toggleTheme(){const d=document.documentElement;const t=d.getAttribute('data-bs-theme')==='dark'?'light':'dark';d.setAttribute('data-bs-theme',t);localStorage.setItem('bottalk-theme',t);}
</script>

    <!-- Nav -->
    <nav class="navbar navbar-expand-lg border-bottom mb-4 theme-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-chat-dots-fill text-info me-2"></i>BotTalk
                <small>memory board</small>
            </a>
            <div class="d-flex align-items-center gap-3">
                {% if authenticated %}
                    <a href="/analytics" class="btn btn-outline-info btn-sm"><i class="bi bi-graph-up"></i> Analytics</a>
                    <button class="btn btn-outline-secondary btn-sm" onclick="toggleTheme()" title="Toggle light/dark mode"><i class="bi bi-circle-half"></i></button>
                    <span class="text-secondary small"><i class="bi bi-person-circle"></i> {{ user }}</span>
                    <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
                {% else %}
                    <a href="/login" class="btn btn-outline-info btn-sm">Login</a>
                    <button class="btn btn-outline-secondary btn-sm" onclick="toggleTheme()" title="Toggle light/dark mode"><i class="bi bi-circle-half"></i></button>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
